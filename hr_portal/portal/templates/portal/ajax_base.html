{# Used instead of base.html for ajax requests: only the page content (+ any new messages) is sent back. #}
{% if messages %}<div id="ajax-flash">{% for message in messages %}<div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %} alert-dismissible fade show" role="alert">{{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>{% endfor %}</div>{% endif %}
{% block content %}{% endblock %}
